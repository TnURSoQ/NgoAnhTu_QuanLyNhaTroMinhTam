{% extends 'base.html' %}
{% block content %}

  Tài khoản này chưa được cấp quyền sử dụng hệ thống. Vui lòng liên hệ chủ trọ.
</div>
<form method="post" action="{% url 'logout' %}">

</form>
{% endblock %}
