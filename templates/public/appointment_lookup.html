{% extends 'base_public.html' %}
{% block title %}Tra cứu lịch hẹn · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <section class="soft-card p-4">
      <h1 class="fs-3 fw-bold mb-1">Tra cứu lịch hẹn</h1>
      <p class="text-muted">Nhập mã lịch hẹn bạn nhận được khi đặt lịch xem phòng.</p>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="get">
        <div class="input-icon mb-3"><i class="bi bi-search"></i>
          <input type="text" name="code" value="{{ code }}" class="form-control text-uppercase" placeholder="Ví dụ: LH7K2M9X" maxlength="10" autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Tra cứu</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
