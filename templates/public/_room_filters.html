<form method="get" action="{{ filter_url }}#phong-trong" class="room-search" aria-label="Tìm kiếm và lọc phòng">
  <div class="search-main">
    <label class="search-field search-keyword" for="room-query"><span><i class="bi bi-search"></i> Bạn đang tìm phòng như thế nào?</span><input id="room-query" type="search" name="q" value="{{ q }}" placeholder="Số phòng, điều hòa, phòng thoáng…" autocomplete="off"></label>
    <label class="search-field" for="room-price"><span><i class="bi bi-wallet2"></i> Khoảng giá</span><select id="room-price" name="price"><option value="">Tất cả mức giá</option>{% for key, range in price_ranges.items %}<option value="{{ key }}" {% if key == price %}selected{% endif %}>{{ range.2 }}</option>{% endfor %}</select></label>
    <label class="search-field" for="room-floor"><span><i class="bi bi-building"></i> Tầng</span><select id="room-floor" name="floor"><option value="">Tất cả các tầng</option>{% for f in floors %}<option value="{{ f }}" {% if f == floor %}selected{% endif %}>Tầng {{ f }}</option>{% endfor %}</select></label>
    <label class="search-field" for="room-people"><span><i class="bi bi-people"></i> Số người ở</span><select id="room-people" name="people"><option value="">Không giới hạn</option>{% for n in capacities %}<option value="{{ n }}" {% if n == people %}selected{% endif %}>Từ {{ n }} người</option>{% endfor %}</select></label>
    <button class="btn btn-primary search-submit" type="submit"><i class="bi bi-search"></i> Tìm phòng</button>
  </div>
  <div class="search-extra">
    <span class="search-extra-label"><i class="bi bi-sliders2"></i> Lọc thêm</span>
    <label for="room-amenity" class="visually-hidden">Tiện ích</label><select id="room-amenity" name="amenity" class="search-small-select"><option value="">Tất cả tiện ích</option>{% for a in amenities %}<option value="{{ a }}" {% if a == amenity %}selected{% endif %}>{{ a }}</option>{% endfor %}</select>
    <label for="room-sort" class="visually-hidden">Sắp xếp</label><select id="room-sort" name="sort" class="search-small-select"><option value="">Sắp xếp theo tầng</option><option value="gia_tang" {% if sort == 'gia_tang' %}selected{% endif %}>Giá thấp đến cao</option><option value="gia_giam" {% if sort == 'gia_giam' %}selected{% endif %}>Giá cao đến thấp</option></select>
    {% if has_filters %}<a class="search-reset" href="{{ filter_url }}#phong-trong"><i class="bi bi-x-circle"></i> Xóa bộ lọc</a>{% endif %}
  </div>
</form>
