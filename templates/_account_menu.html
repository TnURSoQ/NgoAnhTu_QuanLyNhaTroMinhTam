<div class="dropdown ms-auto">
  <button class="user-chip dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu tài khoản">
    <span class="avatar">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
    <span class="d-none d-sm-block text-start lh-sm">
      <strong>{{ user.first_name|default:user.username }}</strong>
      <small>{% if user.role == 'owner' %}Chủ trọ{% elif user.role == 'tenant' %}Người thuê{% elif user.is_staff %}Quản trị hệ thống{% else %}Tài khoản{% endif %}</small>
    </span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li><a class="dropdown-item" href="{% url 'home' %}"><i class="bi bi-house-door me-2"></i>Trang chủ</a></li>
    {% if user.role == 'owner' %}
      <li><a class="dropdown-item" href="{% url 'owner_dashboard' %}"><i class="bi bi-grid-1x2 me-2"></i>Quản lý phòng trọ</a></li>
    {% elif user.role == 'tenant' %}
      <li><a class="dropdown-item" href="{% url 'my_room' %}"><i class="bi bi-door-open me-2"></i>Phòng của tôi</a></li>
    {% elif user.is_staff and not hide_admin_navigation %}
      <li><a class="dropdown-item" href="{% url 'admin:index' %}"><i class="bi bi-gear me-2"></i>Quản trị hệ thống</a></li>
    {% endif %}
    <li><hr class="dropdown-divider"></li>
    <li><a class="dropdown-item" href="{% url 'password_change' %}"><i class="bi bi-key me-2"></i>Đổi mật khẩu</a></li>
    <li>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
      </form>
    </li>
  </ul>
</div>
