{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="soft-card p-4 text-center">
      <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
      <h4>{{ title }}</h4>
      <p class="text-muted">{{ message }}</p>
      {% if blocked %}
        <div class="alert alert-warning text-start">{{ blocked_message }}</div>
        <a class="btn btn-outline-brand" href="{{ back_url }}">Quay lại</a>
      {% else %}
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4">Xóa</button>
          <a class="btn btn-outline-brand" href="{{ back_url }}">Hủy</a>
        </form>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
